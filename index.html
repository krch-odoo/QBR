<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QBR Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F6;--surface:#FFFFFF;--sunk:#F7F8FA;--ink:#1C2130;--muted:#5B6274;--line:#D9DCE4;
  --plum:#714B67;--plum-ink:#FFFFFF;--plum-soft:#F2EAF0;--teal:#017E84;--teal-soft:#DFF1F1;
  --amber:#8F5E0E;--amber-soft:#FBEFD8;--red:#B23A3A;--red-soft:#F8E1E1;--green:#1F7A4D;--green-soft:#E0F2E8;
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fb:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151B;--surface:#1B1E26;--sunk:#171A21;--ink:#E8EAF0;--muted:#9EA5B5;--line:#2D313C;
  --plum:#C79BBD;--plum-ink:#1B1E26;--plum-soft:#2D2230;--teal:#52C4C9;--teal-soft:#16302F;
  --amber:#E6B455;--amber-soft:#33291A;--red:#EE8080;--red-soft:#3A2023;--green:#6BCF97;--green-soft:#173024;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151B;--surface:#1B1E26;--sunk:#171A21;--ink:#E8EAF0;--muted:#9EA5B5;--line:#2D313C;
  --plum:#C79BBD;--plum-ink:#1B1E26;--plum-soft:#2D2230;--teal:#52C4C9;--teal-soft:#16302F;
  --amber:#E6B455;--amber-soft:#33291A;--red:#EE8080;--red-soft:#3A2023;--green:#6BCF97;--green-soft:#173024;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;cursor:pointer;padding:4px 0}
.brand b{font:800 19px/1 var(--fd);letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:13px}
.mark{width:22px;height:22px;border-radius:50%;border:5px solid var(--plum)}
.tb{font-size:14px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center}
.tb.primary{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
.tb:hover{background:var(--sunk)}.tb.primary:hover{filter:brightness(1.08);background:var(--plum)}

/* workbook layout */
.wb{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.steps{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:2px}
.ph{font-size:12px;color:var(--muted);margin:14px 10px 4px;font-weight:600}
.ph:first-child{margin-top:0}
.step{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer}
.step:hover{background:var(--surface)}
.step.on{background:var(--plum-soft);font-weight:600}
.step small{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.ring{width:24px;height:24px;display:block}
.rb{fill:none;stroke:var(--line);stroke-width:3}
.rf{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .35s ease}
.rk{fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ring-num{width:24px;height:24px;border-radius:50%;background:var(--plum);color:var(--plum-ink);font:700 10px/1 var(--fd);display:grid;place-items:center}
.pane{min-width:0}

.head{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px}
.head h1{font:800 clamp(26px,4vw,38px)/1.05 var(--fd);margin:0 0 10px;letter-spacing:-.02em;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.hs{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--teal);transition:width .35s ease}
.saved{min-width:64px;text-align:right}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done,.pill.h-g{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.h-y,.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.h-r{background:var(--red-soft);color:var(--red);border-color:transparent}

.blk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.blk h2{font:700 20px/1.2 var(--fd);margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px;max-width:70ch}
.note{background:var(--teal-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;margin:0 0 14px}
.empty{color:var(--muted);margin:0}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.grid.one{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.fl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--amber);flex:none;transition:background .2s,border-color .2s}
.f.ok .dot{background:var(--teal);border-color:var(--teal)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:44px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:transparent;background:var(--surface)}
.hint{color:var(--muted);font-size:12px}

.deck{border-left:4px solid var(--plum);background:var(--plum-soft);border-radius:0 14px 14px 0;padding:14px 18px;margin-bottom:16px}
.deck-h{font-weight:700;font-size:13px;color:var(--plum);margin-bottom:4px}
.deck ul{margin:0;padding-left:18px}
.deck li{margin:4px 0;max-width:72ch}
.core li{font-weight:600}
.deck details{margin-top:8px}
.deck summary{cursor:pointer;font-size:13px;color:var(--plum);font-weight:700}
.deck details ul{margin-top:6px}

.row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--sunk)}
.row input,.row select,.row textarea{background:var(--surface)}
.chips,.templ,.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips{margin-top:12px}
.chip{font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip:hover{border-color:var(--plum)}
.chip.on{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--teal);margin:0;flex:none}
.tog.strong{font-weight:700}
.rm{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px;margin-left:auto}
.rm:hover{color:var(--red)}
.add{font-weight:600;color:var(--plum);background:none;border:1.5px dashed var(--plum);border-radius:10px;padding:8px 14px;cursor:pointer}
.add:hover{background:var(--plum-soft)}
.addrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:4px 0 16px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex:none}
.seg button{font-size:13px;padding:6px 13px;border:0;background:none;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sunk)}
.seg .s-G,.seg .s-done{background:var(--green-soft);color:var(--green);font-weight:700}
.seg .s-Y,.seg .s-slipped{background:var(--amber-soft);color:var(--amber);font-weight:700}
.seg .s-R,.seg .s-dropped{background:var(--red-soft);color:var(--red);font-weight:700}

.carry{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.ct small{display:block;color:var(--muted)}

.risk{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.risk.r-G{border-left-color:var(--green)}.risk.r-Y{border-left-color:var(--amber)}.risk.r-R{border-left-color:var(--red)}
.rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rh small{display:block;color:var(--muted);font-size:13px;max-width:56ch}
.risk .grid{margin-top:14px}
.hsum{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;font-size:14px}
.mut{color:var(--muted)}

.tbl-wrap{overflow-x:auto;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;min-width:680px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:0 6px 6px}
.tbl td{padding:4px 6px;vertical-align:middle}
.tbl input,.tbl select{padding:7px 9px}
.x{font-size:18px;text-decoration:none;line-height:1}
.tot{font-weight:600;margin:0 0 14px}
.tot:empty{display:none}

.tests{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);align-items:center}
.tl{font-size:12px;font-weight:700;color:var(--muted)}
.ostat{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;font-size:13px}
.rowfoot{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}

.act{border-left:5px solid var(--line)}
.act.t-retention{border-left-color:var(--red)}.act.t-adoption{border-left-color:var(--teal)}.act.t-growth{border-left-color:var(--plum)}
.sugg{background:var(--red-soft);padding:10px 12px;border-radius:10px;margin-bottom:14px}
.sugg>span,.templ>span{font-size:13px;font-weight:700;margin-right:4px}
.sugg>span{color:var(--red)}
.templ{margin-top:6px}
.templ>span{color:var(--muted)}

.score{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:center}
.dial svg{width:170px;height:170px;display:block}
.dial .rb{stroke-width:11}
.dial .rf{stroke:var(--plum);stroke-width:11}
.dn{font:800 40px var(--fd);fill:var(--ink)}
.dl{font:600 12px var(--fb);fill:var(--muted)}
.dim{display:grid;grid-template-columns:170px 1fr 48px;gap:12px;align-items:center;font-size:14px;margin:7px 0}
.dim .bar i{background:var(--plum)}
.dim b{font-variant-numeric:tabular-nums;text-align:right}
.gaps{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.gaps button{width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;background:var(--amber-soft);border:0;border-radius:8px;padding:9px 12px;cursor:pointer}
.gaps button:hover{filter:brightness(.97)}
.gaps small{color:var(--muted);white-space:nowrap}
.four{padding-left:18px;margin:0}
.four li{margin:7px 0;max-width:72ch}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{font-weight:600;padding:7px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.tabs .on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.preview{white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:380px;overflow:auto;margin:0 0 12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.big{padding:13px 22px;font-size:16px}
.complete{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.complete p{margin:0;font-weight:600}
.stepnav{display:flex;justify-content:space-between;gap:12px;margin-top:4px;flex-wrap:wrap}

/* archive */
.arc{max-width:1100px;margin:0 auto;padding:30px 20px 80px}
.arc-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.arc h1{font:800 clamp(32px,5vw,48px)/1 var(--fd);margin:0 0 8px;letter-spacing:-.025em}
.arc .sub{margin:0}
.search{max-width:420px;background:var(--surface)}
.gh{font:700 19px var(--fd);margin:28px 0 10px;display:flex;gap:8px;align-items:baseline}
.gh small{font:600 13px var(--fb);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.cmain{border:0;background:none;text-align:left;cursor:pointer;padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cmain:hover{background:var(--sunk)}
.cmain:focus-visible{outline-offset:-3px}
.cmain b{font:700 19px/1.2 var(--fd);overflow-wrap:anywhere}
.cmeta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.cbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cact{display:flex;border-top:1px solid var(--line)}
.cact button{flex:1;font-size:13px;padding:9px;border:0;background:none;color:var(--muted);cursor:pointer}
.cact button+button{border-left:1px solid var(--line)}
.cact button:hover{color:var(--ink);background:var(--sunk)}
.cact .del:hover{color:var(--red)}
.hero-empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:40px 24px;text-align:center;margin-top:12px}
.hero-empty h2{font:700 22px var(--fd);margin:0 0 6px}
.hero-empty p{color:var(--muted);margin:0 auto 18px;max-width:52ch}
.nores{color:var(--muted);margin-top:20px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,12,18,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:16px;padding:24px;width:min(470px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mbox h2{font:700 22px var(--fd);margin:0 0 14px}
.mbox .sub{margin:10px 0 18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 40px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#print{display:none}


.seg .on-seg{background:var(--plum-soft);color:var(--plum);font-weight:700}
.f .seg{align-self:flex-start;flex-wrap:wrap}
.hrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rename{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:2px}
.rename:hover{color:var(--ink)}
.hdate{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.hdate input{width:auto;padding:4px 8px}
.metalive{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.more{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.more>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--plum)}
details.more[open]>summary{margin-bottom:10px}
details.more .sub{margin-bottom:12px}
.blk.pin{border:2px solid var(--amber)}
.ver{text-align:center;color:var(--muted);font-size:12px;padding:0 20px calc(28px + env(safe-area-inset-bottom,0px))}

@media (max-width:820px){
  .top{position:static}
  .brand small{display:none}
  .wb{grid-template-columns:1fr;padding:0 12px 80px;gap:12px}
  .steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;flex-direction:row;overflow-x:auto;background:var(--bg);padding:10px 0;margin:0 -12px;padding-left:12px;padding-right:12px}
  .ph{display:none}
  .step{flex:none;grid-template-columns:22px auto;background:var(--surface);border:1px solid var(--line)}
  .step.on{border-color:var(--plum)}
  .step small{display:none}
  .grid{grid-template-columns:1fr}
  .blk,.head{padding:16px}
  .score{grid-template-columns:1fr;justify-items:center}
  .dims{width:100%}
  .dim{grid-template-columns:130px 1fr 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#print){display:none!important}
  body::before{display:none}
  #print{display:block!important;font-family:var(--fb)}
  #print h1{font:800 22pt var(--fd);margin:0 0 4pt}
  #print p{margin:0 0 14pt;color:#555}
  #print pre{white-space:pre-wrap;font:10.5pt/1.5 ui-monospace,Menlo,Consolas,monospace}
}
</style>
</head>
<body>
<header class="top">
  <button class="brand" data-act="view-archive" aria-label="Go to your QBR archive"><span class="mark" aria-hidden="true"></span><b>QBR Workbook</b><small>Odoo Customer Success</small></button>
  <button class="tb" data-act="view-archive">Archive</button>
  <button class="tb primary" data-act="new">Start a QBR</button>
  <button class="tb" data-act="export-json">Export backup</button>
  <label class="tb">Import backup<input type="file" accept="application/json,.json" id="importFile" hidden></label>
</header>
<main id="app"></main>
<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>

<script>
/* ---------- utilities ---------- */
const STORE = 'odoo-qbr-workbook-v1';   /* never change: reps' archives are saved under this key */
const APP_VERSION = '1.1';
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const filled = v => String(v ?? '').trim().length > 0;
function todayISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d] = iso.slice(0,10).split('-').map(Number); if(!y) return ''; return new Date(y, m-1, d||1).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
const monthKey = iso => iso ? iso.slice(0, 7) : '0000-00';
function monthLabel(k){ const [y,m] = k.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'}); }
const getP = (o, p) => p.split('.').reduce((a, k) => a == null ? undefined : a[k], o);
function setP(o, p, v){ const ks = p.split('.'); let a = o; for(let i = 0; i < ks.length - 1; i++){ if(a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length-1]] = v; }
const slug = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'qbr';
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }

/* ---------- reference data ---------- */
const STEPS = [
  {id:'prep', phase:'Before the call', title:'Account prep'},
  {id:'business', phase:'In the room', title:'Business and goals'},
  {id:'value', phase:'In the room', title:'Value and adoption'},
  {id:'eco', phase:'In the room', title:'Software ecosystem'},
  {id:'risks', phase:'In the room', title:'Retention risks'},
  {id:'growth', phase:'In the room', title:'Growth opportunities'},
  {id:'actions', phase:'Wrap up', title:'Action plan'},
  {id:'close', phase:'Wrap up', title:'Close and log'}
];
const RISK_CATS = [
  ['relationship','Relationship','Sponsor strength, dependence on one contact, engagement, departures, trust.'],
  ['adoption','Adoption and value','Critical workflow adoption, spreadsheets, unmet expectations, unclear ROI.'],
  ['support','Support and technical','Recurring issues, escalations, integrations, upgrades, technical debt.'],
  ['commercial','Commercial','Price concerns, user reductions, budget pressure, competitor evaluations.'],
  ['strategic','Strategic','Acquisition, restructuring, model changes, needs the setup may not support.']
];
const STATUSES = ['Live','In implementation','Unknown'];
const METHODS = ['Success Pack','Self-implemented','Partner'];
const PHASES = ['Discovery','Configuration','Data migration','Training and testing','Go-live prep'];
const TRACK = ['On track','At risk','Slipped'];
const TRACK_CLS = {'On track':'s-G','At risk':'s-Y','Slipped':'s-R'};
const ROLES = ['Economic buyer','Sponsor','Champion','Admin','Detractor','Partner'];
const DEPTS = ['Sales','Marketing','Finance','Operations','Supply chain','Service','HR','Commerce','Reporting','Other'];
const FITS = ['Odoo can replace','Partial overlap','Keep (specialized)','Needs validation'];
const AREAS = ['CRM and marketing','Sales execution','Customer support','Accounting and admin','Inventory and manufacturing','Projects and timesheets','HR and workforce','Website, eCommerce, POS','Reporting','Other'];
const TESTS = [['impact','Business impact'],['urgency','Urgency'],['fit','Functional fit'],['feas','Feasibility'],['strat','Strategic value']];
const TYPES = ['Retention','Adoption','Growth'];
const TEMPL = [
  ['Resolve key pain point','Retention','Customer confirms the outcome'],
  ['Validate software fit','Growth','Requirements and gaps documented'],
  ['Improve adoption','Adoption','Target workflow adopted'],
  ['Mitigate churn risk','Retention','Risk reduced against agreed criteria'],
  ['Evaluate growth opportunity','Growth','Qualified next step or reason to defer']
];

/* ---------- data ---------- */
let db = {qbrs:[], lastBackup:null};
const state = {view:'archive', id:null, step:'prep', search:''};
const R = () => ({rating:'', evidence:'', owner:'', checkpoint:''});

function blank(company){
  const now = new Date().toISOString();
  return {
    id:uid(), company:company||'', status:'draft', qbrDate:todayISO(), createdAt:now, updatedAt:now, completedAt:null, priorId:null,
    snapshot:{implStatus:'', implMethod:'', confirmedOnCall:false, partner:'', goLive:'', industry:'', renewal:'', users:'', hosting:'', version:'', apps:'', custom:''},
    impl:{phase:'', target:'', track:'', blocker:'', hours:'', live:''},
    stakeholders:[{name:'', title:'', roles:[], changed:false}],
    carry:[], hyp:['','',''],
    business:{priorities:['','',''], changes:'', revenue:'', metrics:'', deep:{current:'', people:'', friction:'', outcome:'', next:''}},
    value:{result:'', leave:'', unmet:'', notes:''},
    eco:{rows:[], none:false, notes:''},
    risks:Object.fromEntries(RISK_CATS.map(c => [c[0], R()])), riskQuotes:'',
    growth:{rows:[], none:false},
    actions:[], notes:'', frozen:null
  };
}
function normalize(x){
  const b = blank(x.company);
  const xb = x.business || {};
  return {...b, ...x,
    snapshot:{...b.snapshot, ...(x.snapshot||{})},
    impl:{...b.impl, ...(x.impl||{})},
    stakeholders:Array.isArray(x.stakeholders) ? x.stakeholders.map(s => ({name:'', title:'', roles:[], changed:false, ...s})) : b.stakeholders,
    carry:Array.isArray(x.carry) ? x.carry : [],
    hyp:Array.isArray(x.hyp) ? [0,1,2].map(i => x.hyp[i] || '') : b.hyp,
    business:{...b.business, ...xb, priorities:[0,1,2].map(i => (xb.priorities||[])[i] || ''), deep:{...b.business.deep, ...(xb.deep||{})}},
    value:{...b.value, ...(x.value||{})},
    eco:{...b.eco, ...(x.eco||{}), rows:((x.eco||{}).rows)||[]},
    risks:Object.fromEntries(RISK_CATS.map(([k]) => [k, {...R(), ...((x.risks||{})[k]||{})}])),
    growth:{...b.growth, ...(x.growth||{}), rows:(((x.growth||{}).rows)||[]).map(r => {
      const o = {tests:{}, deferred:false, ...r};
      if(filled(o.defer) && !filled(o.next)){ o.next = o.defer; o.deferred = true; }   /* v1.0 kept defer reasons separately */
      delete o.defer; return o;
    })},
    actions:Array.isArray(x.actions) ? x.actions : [],
    frozen:x.frozen || null
  };
}
function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){ const p = JSON.parse(raw); if(p && Array.isArray(p.qbrs)){ db = {lastBackup:p.lastBackup||null, qbrs:p.qbrs.map(normalize)}; } }
  }catch(e){ toast('Browser storage is unavailable here. Export backups to keep your work.'); }
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try{ localStorage.setItem(STORE, JSON.stringify(db)); setSaved('Saved'); }
    catch(e){ setSaved('Not saved'); toast('Couldn\u2019t save to browser storage. Export a backup now.'); }
  }, 250);
}
function setSaved(t){ const s = $('#saved'); if(s) s.textContent = t; }
function touch(q){ q.updatedAt = new Date().toISOString(); save(); }
const cur = () => db.qbrs.find(x => x.id === state.id);
const sameCo = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const inImpl = q => q.snapshot.implStatus === 'In implementation';
const stepTitle = (s, q) => s.id === 'value' && q && inImpl(q) ? 'Implementation progress' : s.title;

function priorFor(company, excludeId){
  return db.qbrs.filter(q => q.id !== excludeId && sameCo(q.company, company))
    .sort((a, b) => (b.qbrDate||'').localeCompare(a.qbrDate||'') || (b.updatedAt||'').localeCompare(a.updatedAt||''))[0];
}
function createQBR(company){
  const q = blank(company.trim());
  const p = priorFor(company);
  if(p){
    q.priorId = p.id;
    q.snapshot = {...p.snapshot, confirmedOnCall:false};
    q.impl.target = (p.impl||{}).target || '';
    const st = p.stakeholders.filter(s => filled(s.name)).map(s => ({...s, roles:[...s.roles], changed:false}));
    if(st.length) q.stakeholders = st;
    q.carry = [
      ...p.actions.filter(a => filled(a.action)).map(a => ({text:a.action, owner:a.owner||'', due:a.due||'', status:''})),
      ...p.carry.filter(c => c.status === 'slipped').map(c => ({...c, status:''}))
    ];
  }
  db.qbrs.push(q); save();
  return q;
}

/* ---------- scoring ---------- */
const isQualified = r => !r.deferred && !!r.confirmed && filled(r.stakeholder) && filled(r.next);
const isDeferred = r => !!r.deferred && filled(r.next);
function checks(q){
  const s = q.snapshot, st = s.implStatus, c = {};
  const roles = q.stakeholders.flatMap(x => filled(x.name) ? x.roles : []);
  c.prep = [['Implementation status', filled(st)]];
  if(st === 'Live' || st === 'In implementation'){
    c.prep.push(['Implementation method', filled(s.implMethod)]);
    if(s.implMethod === 'Partner') c.prep.push(['Partner name', filled(s.partner)]);
  }
  c.prep.push(
    ['Industry', filled(s.industry)], ['Renewal date', filled(s.renewal)], ['Users', filled(s.users)],
    ['Hosting', filled(s.hosting)], ['Version', filled(s.version)], ['Apps in use', filled(s.apps)],
    ['Economic buyer identified', roles.includes('Economic buyer')], ['Champion identified', roles.includes('Champion')],
    ['Hypothesis', filled(q.hyp[0])]
  );
  if(q.carry.length) c.prep.push(['Previous actions reviewed', q.carry.every(x => x.status)]);
  const b = q.business;
  c.business = [];
  if(st === 'Unknown') c.business.push(['Confirm implementation status', false]);
  c.business.push(['Priority 1', filled(b.priorities[0])], ['Priority 2', filled(b.priorities[1])], ['Priority 3', filled(b.priorities[2])],
    ['What\u2019s changed', filled(b.changes)], ['How they make money', filled(b.revenue)]);
  if(inImpl(q)){
    const im = q.impl;
    c.value = [['Current phase', filled(im.phase)], ['Target go-live', filled(im.target)], ['On-track status', filled(im.track)], ['Biggest blocker', filled(im.blocker)]];
  } else {
    const v = q.value;
    c.value = [['Strongest result', filled(v.result)], ['Where people leave Odoo', filled(v.leave)], ['Unmet expectation', filled(v.unmet)]];
  }
  const er = q.eco.rows.filter(r => filled(r.tool));
  c.eco = [['Ecosystem logged or none reported', q.eco.none || er.length > 0]];
  if(er.length) c.eco.push(['Every tool has a fit call', er.every(r => r.fit)]);
  c.risks = RISK_CATS.map(([k, n]) => [n + ' rated', !!q.risks[k].rating]);
  RISK_CATS.forEach(([k, n]) => { const r = q.risks[k]; if(r.rating === 'Y' || r.rating === 'R') c.risks.push([n + ' risk needs evidence, owner, checkpoint', filled(r.evidence) && filled(r.owner) && filled(r.checkpoint)]); });
  const gr = q.growth.rows.filter(r => filled(r.need));
  c.growth = inImpl(q) ? [] : [['Opportunities logged or none flagged', q.growth.none || gr.length > 0]];
  gr.forEach((r, i) => c.growth.push([`Opportunity ${i+1} qualified or deferred`, isQualified(r) || isDeferred(r)]));
  const ac = q.actions.filter(a => filled(a.action));
  c.actions = [['At least one action', ac.length > 0]];
  ac.forEach((a, i) => c.actions.push([`Action ${i+1} needs owner, date, measure`, filled(a.owner) && filled(a.due) && filled(a.measure)]));
  if(RISK_CATS.some(([k]) => q.risks[k].rating === 'R')) c.actions.push(['Retention action for red risk', ac.some(a => a.type === 'Retention')]);
  c.close = [];
  return c;
}
const prog = l => { const t = l.length, d = l.filter(x => x[1]).length; return {d, t, p: t ? d/t : 1}; };
function gaps(q){ const c = checks(q), out = []; STEPS.forEach(s => (c[s.id]||[]).forEach(([l, ok]) => { if(!ok) out.push({step:s.id, label:l}); })); return out; }
function overall(q){ return prog(Object.values(checks(q)).flat()).p; }
function quality(q){
  const c = checks(q), r = l => Math.round(prog(l).p * 20);
  const prev = c.prep.filter(x => x[0] === 'Previous actions reviewed');
  const dims = [
    ['Business understanding', r([...c.prep.filter(x => x[0] !== 'Previous actions reviewed'), ...c.business])],
    [inImpl(q) ? 'Implementation progress' : 'Value and adoption', r(c.value)],
    ['Risk assessment', r(c.risks)],
    ['Ecosystem and growth', r([...c.eco, ...c.growth])],
    ['Action plan', r([...c.actions, ...prev])]
  ];
  return {dims, total: dims.reduce((a, d) => a + d[1], 0)};
}
/* completed QBRs keep the score and gaps they had when completed, so later rule changes don't re-grade them */
function scoreOf(q){
  if(q.status === 'complete' && q.frozen) return q.frozen;
  const qs = quality(q); return {total:qs.total, dims:qs.dims, gaps:gaps(q)};
}
function health(q){
  const n = {G:0, Y:0, R:0};
  RISK_CATS.forEach(([k]) => { const x = q.risks[k].rating; if(x) n[x]++; });
  const rated = n.G + n.Y + n.R;
  let label = 'Health unrated', cls = 'un';
  if(rated){ if(n.R){ label = 'At risk'; cls = 'r'; } else if(n.Y >= 2){ label = 'Watch'; cls = 'y'; } else { label = 'Healthy'; cls = 'g'; } }
  return {label, cls, n, rated};
}
function implLine(q){
  const s = q.snapshot; if(!s.implStatus) return '';
  if(s.implStatus === 'Unknown') return 'Implementation status unknown';
  return s.implStatus + (s.implMethod ? `, ${s.implMethod}${s.implMethod === 'Partner' && filled(s.partner) ? ` (${s.partner.trim()})` : ''}` : '');
}

/* ---------- small renderers ---------- */
function ring(p){
  const C = 2 * Math.PI * 9;
  return `<svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" class="rb"/><circle cx="12" cy="12" r="9" class="rf" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 12 12)"/>${p >= 1 ? '<path d="M8 12.4l2.7 2.7L16.2 9.6" class="rk"/>' : ''}</svg>`;
}
function dial(v){
  const C = 2 * Math.PI * 52;
  return `<svg viewBox="0 0 120 120" role="img" aria-label="Quality score ${v} out of 100"><circle cx="60" cy="60" r="52" class="rb"/><circle cx="60" cy="60" r="52" class="rf" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-v/100)}" transform="rotate(-90 60 60)"/><text x="60" y="64" text-anchor="middle" class="dn">${v}</text><text x="60" y="84" text-anchor="middle" class="dl">of 100</text></svg>`;
}
const SR = t => `<span style="position:absolute;left:-9999px">${t}</span>`;
function F(label, path, o = {}){
  const val = getP(cur(), path) ?? '';
  const req = !!o.req, ok = req && filled(val), ra = req ? ' data-req' : '';
  let ctl;
  if(o.opts) ctl = `<select data-b="${path}"${ra}><option value="">Select</option>${o.opts.map(x => `<option${x === val ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  else if(o.rows) ctl = `<textarea rows="${o.rows}" data-b="${path}" placeholder="${esc(o.ph||'')}"${ra}>${esc(val)}</textarea>`;
  else ctl = `<input type="${o.type||'text'}" data-b="${path}" value="${esc(val)}" placeholder="${esc(o.ph||'')}"${ra}>`;
  return `<label class="f${o.full ? ' full' : ''}${ok ? ' ok' : ''}"><span class="fl">${req ? '<i class="dot" aria-hidden="true"></i>' : ''}${esc(label)}${req ? SR('(required)') : ''}</span>${ctl}${o.hint ? `<small class="hint">${esc(o.hint)}</small>` : ''}</label>`;
}
/* single-choice button group; clicking writes the value and re-renders */
function SEG(label, path, opts, o = {}){
  const val = getP(cur(), path) ?? '';
  const req = !!o.req, ok = req && filled(val);
  return `<div class="f${o.full ? ' full' : ''}${ok ? ' ok' : ''}"><span class="fl">${req ? '<i class="dot" aria-hidden="true"></i>' : ''}${esc(label)}${req ? SR('(required)') : ''}</span><div class="seg" role="group" aria-label="${esc(label)}">${opts.map(x => `<button type="button" class="${val === x ? ((o.cls && o.cls[x]) || 'on-seg') : ''}" data-act="setv" data-path="${path}" data-v="${esc(x)}" aria-pressed="${val === x}">${esc(x)}</button>`).join('')}</div></div>`;
}
const I = (path, aria, type = 'text', ph = '') => `<input type="${type}" data-b="${path}" value="${esc(getP(cur(), path) ?? '')}" aria-label="${esc(aria)}" placeholder="${esc(ph)}">`;
const S = (path, opts, aria) => { const v = getP(cur(), path) ?? ''; return `<select data-b="${path}" aria-label="${esc(aria)}"><option value="">Select</option>${opts.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`; };
function deck(core, more){
  return `<div class="deck"><div class="deck-h">Ask these first</div><ul class="core">${core.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${more.length ? `<details><summary>More prompts (${more.length})</summary><ul>${more.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}</div>`;
}
function ecoTotal(q){
  const n = q.eco.rows.reduce((s, r) => s + (parseFloat(String(r.cost||'').replace(/[^0-9.]/g, '')) || 0), 0);
  return n ? `Estimated spend outside Odoo: $${Math.round(n).toLocaleString('en-US')} per year` : '';
}
function healthSum(q){ const h = health(q); return `<span class="pill h-${h.cls}">${h.label}</span><span class="mut">${h.rated} of 5 rated</span>`; }
function oppStatus(r){
  if(!r) return '';
  const t = TESTS.filter(([k]) => r.tests && r.tests[k]).length;
  if(r.deferred) return filled(r.next) ? `<span class="pill">Deferred</span>` : `<span class="pill warn">Add a reason to defer</span>`;
  if(isQualified(r)) return `<span class="pill done">Qualified</span><span class="mut">${t} of 5 tests passed</span>`;
  const miss = [!r.confirmed && 'customer confirmation', !filled(r.stakeholder) && 'stakeholder', !filled(r.next) && 'next step'].filter(Boolean);
  return `<span class="pill warn">Not qualified yet</span><span class="mut">Missing ${miss.join(', ')}. ${t} of 5 tests passed.</span>`;
}
const anyFilled = (...v) => v.some(filled);

/* ---------- step renderers ---------- */
function rPrep(q){
  const p = q.priorId && db.qbrs.find(x => x.id === q.priorId), s = q.snapshot;
  const known = s.implStatus === 'Live' || s.implStatus === 'In implementation';
  return `
<section class="blk"><h2>Implementation</h2><p class="sub">This shapes the rest of the workbook. Pick Unknown if the account history doesn\u2019t make it clear, and confirm it on the call.</p>
${p ? `<p class="note">Carried forward from the ${esc(fmtDate(p.qbrDate))} QBR. Update anything that changed.</p>` : ''}
<div class="grid">${SEG('Status', 'snapshot.implStatus', STATUSES, {req:1, full:1})}
${known ? SEG('Method', 'snapshot.implMethod', METHODS, {req:1, full:1}) : ''}
${known && s.implMethod === 'Partner' ? F('Partner name', 'snapshot.partner', {req:1}) : ''}
${s.implStatus === 'Live' ? F('Go-live date', 'snapshot.goLive', {type:'date'}) : ''}</div></section>
<section class="blk"><h2>Account snapshot</h2><p class="sub">Fill this in before the call, not during it. Amber dots are required; they turn teal when done.</p>
<div class="grid">
${F('Industry','snapshot.industry',{req:1, ph:'e.g. Wholesaler, Construction, etc.'})}${F('Renewal date','snapshot.renewal',{type:'date', req:1})}
${F('Users','snapshot.users',{type:'number', req:1})}${F('Hosting','snapshot.hosting',{req:1, opts:['Odoo Online','Odoo.sh','On-premise']})}
${F('Version','snapshot.version',{req:1, ph:'e.g. 18.0'})}${F('Apps in use','snapshot.apps',{req:1, ph:'Sales, Inventory, Accounting...'})}
</div>
<details class="more"${filled(s.custom) ? ' open' : ''}><summary>More detail</summary><div class="grid one">${F('Custom modules, integrations, upgrade blockers','snapshot.custom',{rows:2})}</div></details></section>
<section class="blk"><h2>Stakeholders</h2><p class="sub">Tag roles. You need an economic buyer and a champion on file.</p>
${q.stakeholders.map(stakeRow).join('')}
<button class="add" data-act="add" data-list="stakeholders">Add stakeholder</button></section>
${q.carry.length ? `<section class="blk"><h2>Previous actions</h2><p class="sub">Every open action from last quarter gets a status. Slipped items carry into the next QBR automatically.</p>${q.carry.map(carryRow).join('')}</section>` : ''}
<section class="blk"><h2>Hypothesis</h2><p class="sub">What you expect to find. It stays a guess until the customer confirms it.</p>
<div class="grid one">${F('What I expect to find','hyp.0',{req:1, rows:2, hint:'A likely challenge and the Odoo workflow that might help'})}${F('Question that would confirm it','hyp.1')}</div></section>`;
}
function stakeRow(s, i){
  return `<div class="row"><div class="grid">${F('Name',`stakeholders.${i}.name`)}${F('Title',`stakeholders.${i}.title`)}</div>
<div class="chips" role="group" aria-label="Roles">${ROLES.map(r => `<button type="button" class="chip${s.roles.includes(r) ? ' on' : ''}" data-act="role" data-i="${i}" data-role="${r}" aria-pressed="${s.roles.includes(r)}">${r}</button>`).join('')}</div>
<div class="rowfoot"><label class="tog"><input type="checkbox" data-b="stakeholders.${i}.changed"${s.changed ? ' checked' : ''}> New or changed since last QBR</label><button class="rm" data-act="rm" data-list="stakeholders" data-i="${i}">Remove</button></div></div>`;
}
function carryRow(c, i){
  const meta = [c.owner, c.due && ('due ' + fmtDate(c.due))].filter(Boolean).map(esc).join(', ');
  return `<div class="row carry"><div class="ct"><b>${esc(c.text)}</b>${meta ? `<small>${meta}</small>` : ''}</div><div class="seg" role="group" aria-label="Status">${['done','slipped','dropped'].map(s => `<button class="${c.status === s ? 's-' + s : ''}" data-act="carry" data-i="${i}" data-s="${s}" aria-pressed="${c.status === s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div></div>`;
}
function rBusiness(q){
  const unk = q.snapshot.implStatus === 'Unknown', pin = unk || q.snapshot.confirmedOnCall, b = q.business, d = b.deep;
  const core = unk
    ? ['Where are you with your Odoo implementation today, and who is leading it?','What are your top three priorities over the next 12 months?']
    : ['What are your top three priorities over the next 12 months?','What has changed in the business since we last spoke?'];
  const more = [...(unk ? ['What has changed in the business since we last spoke?'] : []),
    'Can you walk me through how the business operates and serves its customers?','What does a typical order, project, or engagement look like from start to finish?','Where does the business experience the most complexity or friction?','Which processes depend on spreadsheets, manual work, or one specific person?','What are the five metrics leadership reviews most often?','What would break first if demand increased significantly?','Can you walk me through the last time that happened?'];
  return deck(core, more)
  + (pin ? `<section class="blk${unk ? ' pin' : ''}"><h2>${unk ? 'Confirm implementation status' : 'Implementation status, confirmed on the call'}</h2><p class="sub">${unk ? 'You marked this unknown in prep. Settle it first; the workbook adjusts to match.' : 'Fix it here if you picked the wrong one.'}</p><div class="grid">${SEG('Status', 'snapshot.implStatus', ['Live','In implementation'], {full:1})}${SEG('Method', 'snapshot.implMethod', METHODS, {full:1})}${q.snapshot.implMethod === 'Partner' ? F('Partner name', 'snapshot.partner') : ''}</div></section>` : '')
  + `<section class="blk"><h2>Priorities</h2><p class="sub">In their words, not ours.</p><div class="grid one">${[0,1,2].map(i => F(`Priority ${i+1}`, `business.priorities.${i}`, {req:1})).join('')}</div></section>
<section class="blk"><h2>Business context</h2><div class="grid one">
${F('What\u2019s changed since the last QBR','business.changes',{req:1, rows:2})}
${F('How they make money','business.revenue',{req:1, ph:'One line: product sales, recurring, projects, services, or a mix'})}</div>
<details class="more"${anyFilled(b.metrics, d.current, d.people, d.friction, d.outcome, d.next) ? ' open' : ''}><summary>Workflow deep dive and leadership metrics</summary><p class="sub">Optional. Use it on the one workflow that matters most this quarter.</p><div class="grid one">
${F('Metrics leadership watches','business.metrics',{rows:2})}
${F('Current state','business.deep.current',{rows:2})}${F('People and systems','business.deep.people',{rows:2})}

/* ---------- log export ---------- */
const RATING = {G:'GREEN', Y:'YELLOW', R:'RED'};
function logText(q){
  const out = [], s = q.snapshot, h = health(q), im = q.impl;
  const blockOut = (title, lines) => { const l = lines.filter(x => x !== null && x !== undefined && x !== ''); if(l.length){ out.push('', title, ...l); } };
  const L = (label, v) => filled(v) ? `${label}: ${String(v).trim()}` : null;
  out.push(`QBR LOG: ${q.company} (${fmtDate(q.qbrDate)})`);
  if(implLine(q)) out.push(`Implementation: ${implLine(q)}.`);
  out.push(`Status: ${q.status === 'complete' ? 'Complete' : 'In progress'}. Account health: ${h.label}${h.rated ? ` (${h.n.G} green, ${h.n.Y} yellow, ${h.n.R} red)` : ''}.`);
  blockOut('ACCOUNT', [L('Industry', s.industry), L('Renewal', fmtDate(s.renewal)), s.implStatus === 'Live' ? L('Go-live', fmtDate(s.goLive)) : null, L('Users', s.users), L('Hosting', [s.hosting, s.version].filter(Boolean).join(', ')), L('Apps', s.apps), L('Custom and integrations', s.custom)]);
  blockOut('STAKEHOLDERS', q.stakeholders.filter(x => filled(x.name)).map(x => `- ${x.name}${filled(x.title) ? ', ' + x.title : ''}${x.roles.length ? ` [${x.roles.join(', ')}]` : ''}${x.changed ? ' (new or changed)' : ''}`));
  blockOut('PREVIOUS ACTIONS', q.carry.map(c => `- ${c.text}: ${c.status || 'not reviewed'}`));
  blockOut('HYPOTHESIS', [L('Expected', q.hyp[0]), L('Confirm with', q.hyp[1]), L('Also', q.hyp[2])]);
  const b = q.business, d = b.deep;
  blockOut('BUSINESS AND GOALS', [
    b.priorities.some(filled) ? 'Priorities:\n' + b.priorities.filter(filled).map((p, i) => `  ${i+1}. ${p}`).join('\n') : null,
    L('What changed', b.changes), L('Revenue model', b.revenue), L('Leadership metrics', b.metrics),
    L('Deep dive, current state', d.current), L('Deep dive, people and systems', d.people), L('Deep dive, friction and impact', d.friction), L('Deep dive, desired outcome', d.outcome), L('Deep dive, next step', d.next)]);
  if(inImpl(q)){
    blockOut('IMPLEMENTATION PROGRESS', [L('Phase', im.phase), L('Target go-live', fmtDate(im.target)), L('Status', im.track), L('Biggest blocker', im.blocker), s.implMethod === 'Success Pack' ? L('Success Pack hours remaining', im.hours) : null, L('Already live', im.live)]);
  } else {
    const v = q.value;
    blockOut('VALUE AND ADOPTION', [L('Strongest result', v.result), L('Where people leave Odoo', v.leave), L('Unmet expectation', v.unmet), L('Adoption notes', v.notes)]);
  }
  const er = q.eco.rows.filter(r => filled(r.tool));
  blockOut('SOFTWARE ECOSYSTEM', [
    ...er.map(r => `- ${r.tool}${r.dept ? ` (${r.dept})` : ''}${filled(r.cost) ? ` | ${r.cost}/yr` : ''}${r.renewal ? ` | renews ${fmtDate(r.renewal)}` : ''}${r.fit ? ` | ${r.fit}` : ''}`),
    ecoTotal(q), q.eco.none && !er.length ? 'No outside tools reported.' : null, L('Notes', q.eco.notes)]);
  blockOut('RETENTION RISKS', [...RISK_CATS.map(([k, n]) => {
    const r = q.risks[k]; let t = `- ${n}: ${RATING[r.rating] || 'NOT RATED'}`;
    if(r.rating === 'Y' || r.rating === 'R'){ if(filled(r.evidence)) t += `\n    Evidence: ${r.evidence}`; if(filled(r.owner)) t += `\n    Owner: ${r.owner}`; if(r.checkpoint) t += `\n    Next checkpoint: ${fmtDate(r.checkpoint)}`; }
    return t; }), L('Customer quotes', q.riskQuotes)]);
  const gr = q.growth.rows.filter(r => filled(r.need));
  blockOut('GROWTH OPPORTUNITIES', [
    ...gr.map(r => { const t = TESTS.filter(([k]) => r.tests && r.tests[k]).length;
      if(r.deferred) return `- ${r.need}${r.area ? ` [${r.area}]` : ''}: Deferred${filled(r.next) ? `. Reason: ${r.next}` : ''}`;
      return `- ${r.need}${r.area ? ` [${r.area}]` : ''}: ${isQualified(r) ? 'Qualified' : 'Not qualified'}, ${t}/5 tests${filled(r.stakeholder) ? `. Stakeholder: ${r.stakeholder}` : ''}${filled(r.next) ? `. Next: ${r.next}` : ''}`; }),
    q.growth.none && !gr.length && !inImpl(q) ? 'None identified this quarter.' : null]);
  blockOut('ACTION PLAN', q.actions.filter(a => filled(a.action)).map(a => `- ${a.type ? `[${a.type}] ` : ''}${a.action}${filled(a.owner) ? `. Owner: ${a.owner}` : ''}${a.due ? `. Due: ${fmtDate(a.due)}` : ''}${filled(a.measure) ? `. Measure: ${a.measure}` : ''}`));
  blockOut('NOTES', [filled(q.notes) ? q.notes.trim() : null]);
  return out.join('\n');
}
function download(name, text, type){
  const blob = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Copied to clipboard'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Copied to clipboard'); }catch(_){ toast('Copy failed. Select the preview text and copy it manually.'); }
    ta.remove();
  }
}

function card(q){
  const h = health(q), sc = scoreOf(q), g = sc.gaps.length, hist = db.qbrs.filter(x => sameCo(x.company, q.company)).length, il = implLine(q);
  return `<article class="card"><button class="cmain" data-act="open" data-id="${q.id}"><b>${esc(q.company) || 'Untitled QBR'}</b><span class="cmeta"><span>${esc(fmtDate(q.qbrDate))}</span>${hist > 1 ? `<span>${hist} QBRs on file</span>` : ''}</span>
${il ? `<span class="cmeta"><span>${esc(il)}</span></span>` : ''}
<span class="cbadges"><span class="pill h-${h.cls}">${h.label}</span><span class="pill">Score ${sc.total}</span>${g ? `<span class="pill warn">${g} gap${g > 1 ? 's' : ''}</span>` : '<span class="pill done">No gaps</span>'}</span></button>
<div class="cact">${q.status === 'complete' ? `<button data-act="next" data-id="${q.id}">Start next QBR</button>` : `<button data-act="open" data-id="${q.id}">Continue</button>`}<button class="del" data-act="del" data-id="${q.id}">Delete</button></div></article>`;
}
function render(){ if(state.view === 'work') renderWork(); else renderArchive(); }

/* ---------- modal ---------- */
function modal(html){ const m = $('#modal'); m.querySelector('.mbox').innerHTML = html; m.hidden = false; }
function closeModal(){ $('#modal').hidden = true; }
function openNew(){
  const cos = [...new Set(db.qbrs.map(q => q.company))].sort();
  modal(`<h2>Start a QBR</h2><label class="f full"><span class="fl">Company</span><input id="newCo" list="coList" placeholder="Company name" autocomplete="off"></label>
<datalist id="coList">${cos.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
<p class="sub" id="newHint">The company name links this QBR to its history.</p>
<div class="btns" style="justify-content:flex-end"><button class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary" data-act="create">Start QBR</button></div>`);
  setTimeout(() => $('#newCo').focus(), 30);
}
function openRename(q){
  modal(`<h2>Rename</h2><label class="f full"><span class="fl">Company</span><input id="renameCo" value="${esc(q.company)}" autocomplete="off"></label>
<p class="sub">Use the same spelling as earlier QBRs so this one stays linked to that company\u2019s history.</p>
<div class="btns" style="justify-content:flex-end"><button class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary" data-act="do-rename">Save name</button></div>`);
  setTimeout(() => { const i = $('#renameCo'); i.focus(); i.select(); }, 30);
}
function updNewHint(v){
  const h = $('#newHint'); if(!h) return;
  const p = filled(v) && priorFor(v);
  h.textContent = p ? `Found a QBR from ${fmtDate(p.qbrDate)}. Its snapshot, stakeholders, and actions will carry forward.` : 'The company name links this QBR to its history.';
}
function openQBR(q){ state.id = q.id; state.view = 'work'; state.step = q.status === 'complete' ? 'close' : 'prep'; render(); window.scrollTo(0, 0); }
function doComplete(){
  const q = cur(), qs = quality(q);
  q.frozen = {total:qs.total, dims:qs.dims, gaps:gaps(q)};
  q.status = 'complete'; q.completedAt = todayISO(); touch(q); closeModal(); renderWork();
  toast(`QBR completed and filed under ${monthLabel(monthKey(q.completedAt))}`);
}

/* ---------- events ---------- */
function onField(e){
  const el = e.target;
  if(el.id === 'search'){ state.search = el.value; renderResults(); return; }
  if(el.id === 'newCo'){ updNewHint(el.value); return; }
  if(!el.dataset || !el.dataset.b) return;
  const q = cur(); if(!q) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  setP(q, el.dataset.b, val);
  if(/^actions\.\d+\.type$/.test(el.dataset.b)){ const row = el.closest('.act'); if(row) row.className = 'row act t-' + String(val).toLowerCase(); }
  if(el.hasAttribute('data-req')){ const f = el.closest('.f'); if(f) f.classList.toggle('ok', filled(val)); }
  touch(q); refreshLive(q);
}
document.addEventListener('input', onField);
document.addEventListener('change', e => { if(e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onField(e); });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b){ if(e.target.id === 'modal') closeModal(); return; }
  const act = b.dataset.act, q = cur(), i = +b.dataset.i;
  const rerender = () => { touch(q); renderWork(); };
  switch(act){
    case 'view-archive': state.view = 'archive'; render(); window.scrollTo(0, 0); break;
    case 'new': openNew(); break;
    case 'close-modal': closeModal(); break;
    case 'create': {
      const co = ($('#newCo').value || '').trim();
      if(!co){ toast('Add a company name to start.'); $('#newCo').focus(); return; }
      closeModal(); openQBR(createQBR(co)); break;
    }
    case 'rename': openRename(q); break;
    case 'do-rename': {
      const co = ($('#renameCo').value || '').trim();
      if(!co){ toast('Add a company name.'); return; }
      q.company = co; closeModal(); rerender(); toast('Renamed'); break;
    }
    case 'open': openQBR(db.qbrs.find(x => x.id === b.dataset.id)); break;
    case 'next': { const src = db.qbrs.find(x => x.id === b.dataset.id); openQBR(createQBR(src.company)); toast('Snapshot, stakeholders, and actions carried forward'); break; }
    case 'del': {
      const x = db.qbrs.find(y => y.id === b.dataset.id);
      if(confirm(`Delete the ${x.company || 'untitled'} QBR from ${fmtDate(x.qbrDate)}? This can\u2019t be undone.`)){
        db.qbrs = db.qbrs.filter(y => y.id !== x.id); save(); renderArchive(); toast('QBR deleted');
      }
      break;
    }
    case 'step': state.step = b.dataset.step; renderWork(); window.scrollTo(0, 0); break;
    case 'setv': {
      const path = b.dataset.path, v = b.dataset.v, was = getP(q, path);
      setP(q, path, v);
      if(path === 'snapshot.implStatus' && was === 'Unknown' && v !== 'Unknown' && state.step === 'business') q.snapshot.confirmedOnCall = true;
      if(path === 'snapshot.implStatus' && was === 'Unknown' && v !== 'Unknown')
        toast(v === 'In implementation' ? 'Status set. Value and adoption is now Implementation progress.' : 'Status set to Live.');
      rerender(); break;
    }
    case 'add': {
      const path = b.dataset.list, arr = getP(q, path);
      const fresh = {
        'stakeholders': () => ({name:'', title:'', roles:[], changed:false}),
        'eco.rows': () => ({tool:'', dept:'', cost:'', renewal:'', fit:''}),
        'growth.rows': () => ({need:'', area:'', stakeholder:'', next:'', deferred:false, tests:{}, confirmed:false}),
        'actions': () => ({action:'', type:'', owner:'', due:'', measure:''})
      }[path]();
      arr.push(fresh);
      if(path === 'eco.rows') q.eco.none = false;
      if(path === 'growth.rows') q.growth.none = false;
      rerender();
      const target = document.querySelector(`[data-b^="${path}.${arr.length - 1}."]`); if(target) target.focus();
      break;
    }
    case 'rm': getP(q, b.dataset.list).splice(i, 1); rerender(); break;
    case 'role': { const r = q.stakeholders[i].roles, role = b.dataset.role, k = r.indexOf(role); k < 0 ? r.push(role) : r.splice(k, 1); rerender(); break; }
    case 'carry': { const c = q.carry[i]; c.status = c.status === b.dataset.s ? '' : b.dataset.s; rerender(); break; }
    case 'rate': { const r = q.risks[b.dataset.k]; r.rating = r.rating === b.dataset.v ? '' : b.dataset.v; rerender(); break; }
    case 'oppmode': q.growth.rows[i].deferred = b.dataset.v === '1'; rerender(); break;
    case 'riskact': {
      const k = b.dataset.k, r = q.risks[k], n = RISK_CATS.find(c => c[0] === k)[1];
      q.actions.push({action:`Mitigate ${n.toLowerCase()} risk: `, type:'Retention', owner:r.owner||'', due:r.checkpoint||'', measure:'Risk reduced against agreed criteria', risk:k});
      rerender(); break;
    }
    case 'templ': { const t = TEMPL[i]; q.actions.push({action:t[0], type:t[1], owner:'', due:'', measure:t[2]}); rerender(); break; }
    case 'copy': copyText(logText(q)); break;
    case 'txt': download(`${slug(q.company)}-qbr-log-${q.qbrDate}.txt`, logText(q), 'text/plain'); toast('Downloaded'); break;
    case 'pdf': {
      $('#print').innerHTML = `<h1>${esc(q.company)} QBR log</h1><p>${esc(fmtDate(q.qbrDate))}</p><pre>${esc(logText(q))}</pre>`;
      window.print(); break;
    }
    case 'complete': {
      const g = gaps(q).length;
      if(g) modal(`<h2>Complete with ${g} gap${g > 1 ? 's' : ''}?</h2><p class="sub">You can close them later. The archive card shows the gap count as of completion.</p><div class="btns" style="justify-content:flex-end"><button class="btn ghost" data-act="close-modal">Keep working</button><button class="btn primary" data-act="do-complete">Complete QBR</button></div>`);
      else doComplete();
      break;
    }
    case 'do-complete': doComplete(); break;
    case 'reopen': q.status = 'draft'; q.completedAt = null; q.frozen = null; rerender(); toast('Reopened. Complete it again when you\u2019re done.'); break;
    case 'export-json': {
      if(!db.qbrs.length){ toast('Nothing to back up yet.'); return; }
      download(`qbr-workbook-backup-${todayISO()}.json`, JSON.stringify({app:'qbr-workbook', version:APP_VERSION, exportedAt:new Date().toISOString(), qbrs:db.qbrs}, null, 2), 'application/json');
      db.lastBackup = todayISO(); save(); if(state.view === 'archive') renderArchive(); toast('Backup downloaded');
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if(e.key === 'Enter' && e.target.id === 'newCo'){ e.preventDefault(); document.querySelector('[data-act="create"]').click(); }
  if(e.key === 'Enter' && e.target.id === 'renameCo'){ e.preventDefault(); document.querySelector('[data-act="do-rename"]').click(); }
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result), list = Array.isArray(data) ? data : data.qbrs;
      if(!Array.isArray(list)) throw new Error('bad');
      let added = 0, upd = 0;
      list.forEach(x => {
        if(!x || !x.id || typeof x.company !== 'string') return;
        const k = db.qbrs.findIndex(y => y.id === x.id);
        if(k < 0){ db.qbrs.push(normalize(x)); added++; }
        else if((x.updatedAt||'') > (db.qbrs[k].updatedAt||'')){ db.qbrs[k] = normalize(x); upd++; }
      });
      save(); render(); toast(`Imported ${added} new, ${upd} updated`);
    }catch(_){ toast('That file isn\u2019t a QBR Workbook backup.'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

load(); render();
</script>
</body>
</html>
